<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #05060a; font-family: Inter, sans-serif; color: #e3e7f1; position: relative; }
  .glow1 { position: absolute; width: 700px; height: 700px; left: -200px; top: -320px; background: radial-gradient(circle, rgba(94,234,212,.22), transparent 60%); }
  .glow2 { position: absolute; width: 800px; height: 800px; right: -260px; bottom: -420px; background: radial-gradient(circle, rgba(167,139,250,.22), transparent 60%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 32px 32px; mask-image: radial-gradient(ellipse at 30% 50%, #000 30%, transparent 75%); }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: 'Inter Tight'; font-weight: 800; font-size: 30px; letter-spacing: -.02em; color: #fff; }
  h1 { margin-top: 28px; font-family: 'Inter Tight'; font-weight: 800; font-size: 58px; line-height: 1.02; letter-spacing: -.035em; color: #fff; }
  .grad { background: linear-gradient(92deg, #5eead4 0%, #93c5fd 45%, #a78bfa 100%); -webkit-background-clip: text; color: transparent; }
  p { margin-top: 20px; font-size: 19px; line-height: 1.5; color: #b9c0d4; max-width: 520px; }
  .pills { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-family: 'JetBrains Mono'; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: #e3e7f1; }
  .pill b { color: #5eead4; font-weight: 500; }
  .shot { position: absolute; right: -150px; top: 70px; width: 760px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 120px -20px rgba(94,234,212,.35), 0 0 0 1px rgba(167,139,250,.15); transform: perspective(1600px) rotateY(-14deg) rotateX(5deg); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
  <div class="shot"><img src="../screenshots/command-live.png" /></div>
  <div class="left">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#0b0d14"/><rect x=".5" y=".5" width="63" height="63" rx="15.5" fill="none" stroke="rgba(255,255,255,.1)"/><path d="M32 9 51 16v14c0 12.5-8.2 21.6-19 25-10.8-3.4-19-12.5-19-25V16Z" fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="29" r="5" fill="url(#g)"/><path d="M32 33v9" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/></svg>
      <span>Consentry</span>
    </div>
    <h1>The consent firewall<br /><span class="grad">for AI agents.</span></h1>
    <p>Your agent can use the world's public data. The world can't use yours. Every byte is inspected, minimized and consented, with a tamper-evident receipt.</p>
    <div class="pills">
      <span class="pill"><b>●</b> 12 live public-data APIs</span>
      <span class="pill"><b>●</b> MCP server</span>
      <span class="pill"><b>●</b> 5/5 attacks contained</span>
      <span class="pill"><b>●</b> SHA-256 ledger</span>
    </div>
  </div>
</body>
</html>
