<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; background: #0e0f0c; font-family: 'Work Sans', sans-serif; color: #f2eee7; position: relative; }
  .glow1 { position: absolute; width: 700px; height: 700px; left: -200px; top: -320px; background: radial-gradient(circle, rgba(239,165,111,.20), transparent 60%); }
  .glow2 { position: absolute; width: 800px; height: 800px; right: -260px; bottom: -420px; background: radial-gradient(circle, rgba(142,166,189,.14), transparent 60%); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,240,225,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,240,225,.028) 1px, transparent 1px); background-size: 32px 32px; mask-image: radial-gradient(ellipse at 30% 50%, #000 30%, transparent 75%); }
  .horizon { position: absolute; left: 0; right: 0; top: 66%; height: 1px; background: linear-gradient(90deg, transparent, rgba(142,166,189,.3) 12%, rgba(247,217,185,.3) 50%, rgba(255,232,206,.8) 78%, transparent); }
  .flare { position: absolute; top: calc(66% - 160px); left: 52%; width: 560px; height: 320px; background: radial-gradient(closest-side, rgba(247,217,185,.26), rgba(239,165,111,.1) 45%, transparent 75%); filter: blur(6px); }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: 'Work Sans'; font-weight: 500; font-size: 24px; letter-spacing: .32em; text-transform: uppercase; color: #fff; }
  h1 { margin-top: 30px; font-family: 'Work Sans'; font-weight: 500; font-size: 56px; line-height: 1.04; letter-spacing: -.02em; color: #fff; }
  .grad { background: linear-gradient(92deg, #f6d8b4 0%, #efa56f 55%, #e07b39 100%); -webkit-background-clip: text; color: transparent; }
  p { margin-top: 20px; font-size: 19px; line-height: 1.5; color: #cdc7bb; max-width: 520px; }
  .pills { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-family: 'JetBrains Mono'; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: #f2eee7; }
  .pill b { color: #efa56f; font-weight: 500; }
  .shot { position: absolute; right: -150px; top: 70px; width: 760px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 120px -20px rgba(239,165,111,.32), 0 0 0 1px rgba(246,216,180,.14); transform: perspective(1600px) rotateY(-14deg) rotateX(5deg); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div><div class="horizon"></div><div class="flare"></div>
  <div class="shot"><img src="../screenshots/command-live.png" /></div>
  <div class="left">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efa56f"/><stop offset="1" stop-color="#f6d8b4"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#141511"/><rect x=".5" y=".5" width="63" height="63" rx="15.5" fill="none" stroke="rgba(255,255,255,.1)"/><path d="M32 9 51 16v14c0 12.5-8.2 21.6-19 25-10.8-3.4-19-12.5-19-25V16Z" fill="none" stroke="url(#g)" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="29" r="5" fill="url(#g)"/><path d="M32 33v9" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/></svg>
      <span>Consentry</span>
    </div>
    <h1>The consent firewall<br /><span class="grad">for AI agents.</span></h1>
    <p>Your agent can use the world's public data. The world can't use yours. Every byte is inspected, minimized and consented, with a tamper-evident receipt.</p>
    <div class="pills">
      <span class="pill"><b>●</b> 12 live public-data APIs</span>
      <span class="pill"><b>●</b> MCP server</span>
      <span class="pill"><b>●</b> 5/5 attacks contained</span>
      <span class="pill"><b>●</b> SHA-256 ledger</span>
    </div>
  </div>
</body>
</html>
